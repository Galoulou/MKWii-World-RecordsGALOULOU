<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion — MKWII World Records</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
    <div class="logo">
        🏆 MKWII WORLD RECORDS
    </div>

    <nav>
        <a href="index.html">Accueil</a>
        <a href="circuits.html">Circuits</a>
        <a href="submit.html">Soumettre un record</a>
        <a href="login.html">Connexion</a>
    </nav>
</header>


<main class="auth-page">

    <div class="auth-container">

        <div class="auth-logo">
            🏆
        </div>

        <h1 id="auth-title">Connexion</h1>

        <p class="auth-description" id="auth-description">
            Connecte-toi pour gérer tes records MKWii.
        </p>


        <!-- CONNEXION -->

        <form id="login-form">

            <div class="form-group">

                <label for="login-email">
                    Adresse e-mail
                </label>

                <input
                    type="email"
                    id="login-email"
                    placeholder="ton@email.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="login-password">
                    Mot de passe
                </label>

                <input
                    type="password"
                    id="login-password"
                    placeholder="Ton mot de passe"
                    required
                >

            </div>


            <button type="submit" class="auth-button">
                Se connecter
            </button>

        </form>


        <!-- INSCRIPTION -->

        <form id="register-form" style="display: none;">

            <div class="form-group">

                <label for="register-username">
                    Pseudo
                </label>

                <input
                    type="text"
                    id="register-username"
                    placeholder="Ton pseudo MKWii"
                    minlength="3"
                    maxlength="20"
                    required
                >

            </div>


            <div class="form-group">

                <label for="register-email">
                    Adresse e-mail
                </label>

                <input
                    type="email"
                    id="register-email"
                    placeholder="ton@email.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="register-password">
                    Mot de passe
                </label>

                <input
                    type="password"
                    id="register-password"
                    placeholder="Minimum 6 caractères"
                    minlength="6"
                    required
                >

            </div>


            <div class="form-group">

                <label for="register-confirm">
                    Confirmer le mot de passe
                </label>

                <input
                    type="password"
                    id="register-confirm"
                    placeholder="Retape ton mot de passe"
                    minlength="6"
                    required
                >

            </div>


            <button type="submit" class="auth-button">
                Créer mon compte
            </button>

        </form>


        <div id="auth-message" class="auth-message"></div>


        <div class="auth-switch">

            <span id="switch-text">
                Pas encore de compte ?
            </span>

            <button id="switch-button" type="button">
                Créer un compte
            </button>

        </div>


        <div class="auth-info">
            🔒 Tes informations sont gérées par Supabase.
        </div>

    </div>

</main>


<footer>
    <p>© 2026 MKWII World Records</p>
    <p>Projet communautaire Mario Kart Wii</p>
</footer>


<script src="js/supabase.js"></script>

<script>

const loginForm = document.getElementById("login-form");
const registerForm = document.getElementById("register-form");

const authTitle = document.getElementById("auth-title");
const authDescription = document.getElementById("auth-description");

const switchText = document.getElementById("switch-text");
const switchButton = document.getElementById("switch-button");

const authMessage = document.getElementById("auth-message");

let registerMode = false;


/* ========================= */
/* AFFICHER UN MESSAGE */
/* ========================= */

function showMessage(message, type) {

    authMessage.textContent = message;

    authMessage.className = "auth-message " + type;

}


/* ========================= */
/* CHANGER CONNEXION / INSCRIPTION */
/* ========================= */

switchButton.addEventListener("click", () => {

    registerMode = !registerMode;

    authMessage.textContent = "";
    authMessage.className = "auth-message";


    if (registerMode) {

        loginForm.style.display = "none";
        registerForm.style.display = "block";

        authTitle.textContent = "Créer un compte";

        authDescription.textContent =
            "Crée ton compte pour participer aux classements MKWii.";

        switchText.textContent =
            "Tu as déjà un compte ?";

        switchButton.textContent =
            "Se connecter";

    } else {

        loginForm.style.display = "block";
        registerForm.style.display = "none";

        authTitle.textContent = "Connexion";

        authDescription.textContent =
            "Connecte-toi pour gérer tes records MKWii.";

        switchText.textContent =
            "Pas encore de compte ?";

        switchButton.textContent =
            "Créer un compte";

    }

});


/* ========================= */
/* CONNEXION */
/* ========================= */

loginForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    const email =
        document.getElementById("login-email").value.trim();

    const password =
        document.getElementById("login-password").value;


    showMessage("Connexion en cours...", "info");


    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });


    if (error) {

        console.error(error);

        showMessage(
            "Erreur : " + error.message,
            "error"
        );

        return;
    }


    showMessage(
        "Connexion réussie ! Redirection...",
        "success"
    );


    setTimeout(() => {

        window.location.href = "profile.html";

    }, 800);

});


/* ========================= */
/* INSCRIPTION */
/* ========================= */

registerForm.addEventListener("submit", async (event) => {

    event.preventDefault();


    const username =
        document.getElementById("register-username").value.trim();

    const email =
        document.getElementById("register-email").value.trim();

    const password =
        document.getElementById("register-password").value;

    const confirm =
        document.getElementById("register-confirm").value;


    if (password !== confirm) {

        showMessage(
            "Les deux mots de passe ne correspondent pas.",
            "error"
        );

        return;
    }


    showMessage(
        "Création du compte...",
        "info"
    );


    const { data, error } =
        await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

                data: {
                    username: username
                }

            }

        });


    if (error) {

        console.error(error);

        showMessage(
            "Erreur : " + error.message,
            "error"
        );

        return;
    }


    /*
       Si Supabase demande une confirmation
       par e-mail, l'utilisateur devra cliquer
       sur le lien reçu.
    */

    if (data.session) {

        showMessage(
            "Compte créé ! Redirection...",
            "success"
        );


        setTimeout(() => {

            window.location.href = "profile.html";

        }, 1000);

    } else {

        showMessage(
            "Compte créé ! Vérifie ton e-mail pour confirmer ton compte.",
            "success"
        );

    }

});

</script>

</body>
</html>
